const MONTH_NAME_MAP = {
  jan: 1, fev: 2, mar: 3, abr: 4, mai: 5, jun: 6, jul: 7, ago: 8, set: 9, out: 10, nov: 11, dez: 12,
  january: 1, february: 2, march: 3, april: 4, may: 5, june: 6, july: 7, august: 8, september: 9, october: 10, november: 11, december: 12,
};

function parseMonthValue(v) {
  if (v instanceof Date) return v.getMonth() + 1;
  if (typeof v === 'number' && v >= 1 && v <= 12) return v;
  const s = String(v || '').toLowerCase().trim();
  const num = parseInt(s, 10);
  if (!isNaN(num) && num >= 1 && num <= 12) return num;
  const keys = Object.keys(MONTH_NAME_MAP);
  for (let i = 0; i < keys.length; i++) if (s.indexOf(keys[i]) !== -1) return MONTH_NAME_MAP[keys[i]];
  return null;
}
function parseYearValue(v) {
  if (v instanceof Date) return v.getFullYear();
  const num = parseInt(String(v || '').trim(), 10);
  if (!isNaN(num) && num > 2000 && num < 2100) return num;
  return null;
}
function extractPeriodFromFilename(name) {
  const s = name.toLowerCase().replace(/[_\-.]+/g, ' ');
  const yearMatch = s.match(/20\d{2}/);
  const year = yearMatch ? parseInt(yearMatch[0], 10) : null;
  let month = null;
  const keys = Object.keys(MONTH_NAME_MAP);
  for (let i = 0; i < keys.length; i++) if (s.indexOf(keys[i]) !== -1) { month = MONTH_NAME_MAP[keys[i]]; break; }
  if (!month) {
    const numMatch = s.match(/\b(0?[1-9]|1[0-2])\b/);
    if (numMatch) month = parseInt(numMatch[0], 10);
  }
  return (month && year) ? year + '-' + String(month).padStart(2, '0') : null;
}
function normalizeKey(raw) {

}
function displayLabel(raw) {

function colorForKey(key) {
  const k = key.toLowerCase();
  if (k.indexOf('not initiated') !== -1 || k.indexOf('not started') !== -1) return { text: 'text-neutral-300', bar: 'bg-neutral-400' };

}

  return 'text-neutral-400 bg-neutral-500/10 border-neutral-500/30';
}
function findHeaderRowAndBuildObjects(sheet) {
  const aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: false });
  let bestIdx = 0, bestScore = -1;
  const scanLimit = Math.min(aoa.length, 15);
  for (let i = 0; i < scanLimit; i++) {
    const row = aoa[i] || [];
    let score = 0;
    row.forEach(cell => {
      const c = String(cell || '').toLowerCase().trim();
      if (c && CTRL_ALIASES_FLAT.indexOf(c) !== -1) score += 1;
    });
    if (score > bestScore) { bestScore = score; bestIdx = i; }
  }
  const headerRow = (aoa[bestIdx] || []).map(h => String(h || '').trim());
  const dataRows = aoa.slice(bestIdx + 1);
  const objects = dataRows
    .filter(r => r.some(cell => String(cell || '').trim() !== ''))
    .map(r => {
      const obj = {};
      headerRow.forEach((h, idx) => { if (h) obj[h] = r[idx] !== undefined ? r[idx] : ''; });
      return obj;
    });
  return { objects, headerFound: bestScore };
}

{code:'IT_ACCESS_04',name:'Urgent Access Revocation of Immediately Terminated Users',domain:'IT ACCESS',key:false,freq:'Event-based',sop:false,scope:'Zone Level Control',what:'Urgent Access Revocation of Immediately Terminated Users. Ensures access of employees/3rd parties terminated with immediate effect is revoked within 2 business hours across all high-impact IT solutions.',l1:'No additional requirement (not a key control).',l2:'Access to high-impact IT solutions revoked within 2 business hours of immediate termination per defined process. Process includes: terminate Citrix/VPN sessions, disable AD credentials, disable ERP credentials, disable payment system access, revoke vault platform access. Change passwords of any shared emergency credentials the employee knew.',l3:'Automated script or tool identifies and blocks all user accounts immediately and terminates all open sessions.',kpi:'No numeric KPI defined. Evidence: signed immediate termination process document (<12 months old), evidence of immediate revocation per process.',notes:'Central point of contact (e.g. Head of IT Security) must be identified and communicated to all People Business Partners. Scope: ALL critical solutions where business impact is high.'},
{code:'IT_ACCESS_05',name:'IT Admin – User Access Management',domain:'IT ACCESS',key:false,freq:'Event-based',sop:false,scope:'Type 1,2,6 · OS · DB',what:'IT Admin – User Access Management. Controls administrative/privileged access. Admins have configuration, maintenance, troubleshooting and user management rights — highest risk account type. Principle of Least Privilege mandatory.',l1:'No additional requirement (not a key control).',l2:'Identify elevated access not needed for routine tasks and restrict where feasible. Temporary elevated grants require business justification + prior approval from Solution Owner or Admin Group Owner. If PIM solution in use: usage logs reviewed by designated owner within 30 working days of usage.',l3:'Same as L2.',kpi:'No numeric KPI. Evidences: list of admins, approval records, usage logs reviewed within 30 days.',notes:'Admin activities (overwrite records, delete configs, reset systems) must be logged and reviewed. Emergency User IDs should be used for critical activities rather than personal end-user IDs. Admins must use unique passwords per solution. Designated owner = IT risk owner (not line manager).'},
{code:'IT_ACCESS_06-K',name:'Review of IT Sensitive Access',domain:'IT ACCESS',key:true,freq:'Bi-Annual + Monthly (L2/L3)',sop:false,scope:'ALL Types: 1,2,3,4,5,6,7 · OS · DB',what:'Review of IT Sensitive Access. Revalidation of IT Admin/technical users with Critical or High IT risk access (Basis, Security, UAM) at least twice per year. BROADEST scope control — applies to every solution type without exception.',l1:'Review and revalidate Critical/High IT risk access at least every 6 months. Revoke inappropriate access within 2 weeks (10 working days).',l2:'For >100 users: staggered monthly review covering all users in 6 months. Treasury/sub-consolidation (Cognos, FCCS, HFM, BPC): quarterly mandatory. Expert Users per IT domain (Basis, Security, UAM).\nCloud: Users with non-read-only access to Tenants/Management Groups/Subscriptions → MONTHLY review.',l3:'Automated workflow, notifications to IT Expert Users monthly. Revocation within 1 week.',kpi:'Critical/High IT risks not remediated within 2 weeks: L2 ≤2% (0 absolute) / L3 =0%',notes:'⚠ BROADEST SCOPE — applies to ALL Types including VPN, Firewalls, Cloud, BI. Expert User = IT risk owner (Basis Expert, Security Expert), NOT line manager. NOT APPLICABLE only if solution has zero Critical/High IT risk access per ABI ruleset.'},
{code:'IT_ACCESS_07-K',name:'Emergency User ID – Access Management (FFID/DDIC)',domain:'IT ACCESS',key:true,freq:'Event-based',sop:false,scope:'Type 1, 6 · OS · DB',what:'Emergency User ID – Access Management (FFID/DDIC). Controls the use of generic emergency accounts for Critical access. Each FFID has a designated owner. Credentials changed and locked after every use. Logs reviewed within 10 working days.',l1:'Generic Emergency User IDs (FFID, DDIC, SAPOSS) used only for Critical access. Each ID has designated owner. Access granted temporarily with documented business justification. Credentials changed and account locked after every use. Logs reviewed within 2 weeks (10 working days).',l2:'Emergency User IDs managed via global tool (SAP GRC, BeyondTrust). Logs reviewed within 5 working days. Logs maintained outside solution (SIEM) for minimum 18 months.',l3:'End-to-end workflow tool for all Emergency User lifecycle: Request, Approval, Granting, Credential Mgmt, Log Review, Audit Evidencing.',kpi:'Usage logs not reviewed within 5 working days: L2 ≤1% / L3 =0%\nFFID usage for SAP outside GRC: L2 ≤2% / L3 ≤1%\nUsage logs retained ≥18 months: Yes/No (mandatory)',notes:'Approved vault platforms: SAP GRC EAM, BeyondTrust, PIM. Non-global tools (KeePass, shared Excel) NOT compliant. Discrepancies must be reported to ABI Ethics. For SAP: DDIC, SAPOSS follow same review process as FFID.'},
{code:'IT_ACCESS_08-K',name:'Access Removal of Employees (Leavers)',domain:'IT ACCESS',key:true,freq:'Daily + Weekly + Event-based',sop:false,scope:'Type 1,2,3,4,5 · OS · DB',what:'Access Removal of Employees (Leavers). Ensures access of terminated employees is removed within 24h of last working day. Zero tolerance — any leaver accessing system post-LWD without log review is an immediate audit finding.',l1:'Daily leavers report → revoke all access within 24h (1 working day) of LWD. Weekly report covering last 6 months → review and remediate gaps. Delay detected: check last login; if logged in after LWD → review activity logs and take corrective action. Reactivation: valid justification + prior approval + defined expiry date + usage log review.',l2:'Review and disable user IDs with >90 days inactivity monthly. If SSO: quarterly reconciliation for IDs inactive >90 days.',l3:'Scripts/Bot/IDM perform daily/weekly deactivation automatically. Reactivation via automated workflow, max 10-day period, activity logs reviewed by automated workflow. Systems <50 users exempt from script requirement.',kpi:'Leavers accessing solution after LWD without log review: L2 = 0 / L3 = 0 (ABSOLUTE ZERO TOLERANCE)',notes:'⚠ ABSOLUTE ZERO — any leaver with post-LWD access + no log review = critical audit finding. SSO applications require additional quarterly AD reconciliation. Reactivation only if LWD postponed or employment type changed.'},
{code:'IT_ACCESS_09',name:'Access Revalidation for Employees Changing Functions (Movers)',domain:'IT ACCESS',key:false,freq:'Monthly',sop:false,scope:'Type 1,2 · OS · DB',what:'Access Revalidation for Employees Changing Functions (Movers). Manages risk of access accumulation when employees change roles — previous function access reviewed and revoked or revalidated. Max 6-month retention in transition.',l1:'No additional requirement (not a key control).',l2:'Monthly movers report generated → shared with old and new line manager for review, validation and approval. Access retained in transition: max 6 months with prior approval. Critical/High risk access of movers revalidated monthly. If all users read-only (e.g. marketing sites): quarterly frequency with Zone S&C alignment.',l3:'Mover access management automated via workflow tool or IDM.',kpi:'Movers with access not reviewed within 1 month: L2 ≤5% / L3 ≤1%',notes:'Movers exiting functions with Critical/High access: must be revoked immediately or formally revalidated. Access cannot exceed 6 months in transition without documented approval.'},
{code:'IT_ACCESS_10-K',name:'Access Revalidation for 3rd Party Users',domain:'IT ACCESS',key:true,freq:'Monthly + Event-based',sop:false,scope:'Type 1,2,3,4 · OS · DB',what:'Access Revalidation for 3rd Party Users. Manages external vendor/supplier/partner access. All 3rd party access must be time-limited (max 90 days) and regularly revalidated. 3rd parties are a major external risk vector.',l1:'Monthly system report of all 3rd party accounts → review and validate by Control Owner. Validate and remediate before next control occurrence.',l2:'3rd party user validity set to maximum 90 days at time of granting. Where technically infeasible: SSO + AD restriction to 90 days (approved by Global IT Compliance).',l3:'Mandatory validity field (system blocks >90 days). Daily automated workflow identifies accounts expiring in 10 days → recertification request to Control Owner. No response → automatic revocation on Day 1 post-expiry + all active sessions terminated. Quarterly reconciliation vs. Saviynt.',kpi:'3rd party users with access >90 days without validation: L2 ≤2% / L3 =0%',notes:'If 3rd party terminates early: sponsor must update actual termination date in IDM immediately. For L3: Saviynt quarterly reconciliation mandatory. All 3rd party access tied to named ABI Sponsor.'},
{code:'IT_ACCESS_11',name:'Access to Critical Business Shared Drives/Folders (Data Crown Jewels)',domain:'IT ACCESS',key:false,freq:'Annual',sop:false,scope:'Zone Level Control',what:'Access to Critical Business Shared Drives/Folders (Data Crown Jewels). Controls who has access to the most sensitive data repositories: consolidation platforms, accounting solutions, management reporting, external reporting, strategic documents.',l1:'No additional requirement (not a key control).',l2:'Maintain list of all data crown jewel folders with business owner details (reviewed and updated with Zone IC). Control owner periodically reviews users with access. Inappropriate access revoked within one month of review. Examples: SAP workspaces, Hyperion/BPC/HFM/Cognos workspaces, BI management reporting, penetration testing reports, strategic meeting minutes.',l3:'Access management automated via Scripts/Bot/workflow-based tool.',kpi:'No numeric KPI. Evidence: list of crown jewel storage drives approved by Internal Controls, access review evidence, access removal evidence (if any) within 1 month.',notes:'All Annual controls must execute before Q3. Data Crown Jewels identified per 10.2 Schedule 2 – IT Platform Classification of Global Information Security Policy (GISP).'},
{code:'IT_ACCESS_12',name:'Access to Technical Interface / Application Folder',domain:'IT ACCESS',key:false,freq:'Annual',sop:false,scope:'Type 1 only',what:'Access to Technical Interface / Application Folder. Controls who has access to application shared folders and interface folders (identified per IT_INV_02 mapping). Inappropriate access revoked within one month of annual review.',l1:'No additional requirement (not a key control).',l2:'Control owner reviews access to all application shared folders/interface folders annually. Inappropriate access revoked within one month. Annual review must complete before Q3.',l3:'Automated via Script/BOT.',kpi:'Access to interface folder/app shared folders not revalidated: L2 ≤5% / L3 ≤1%',notes:'Annual review must complete before Q3 so gaps can be remediated by Q4. Applies only to Type 1 solutions (not applicable to DP-only, websites, VPN, etc.).'},
{code:'IT_ACCESS_13',name:'Review of Rulesets for SoD and Sensitive Access Monitoring',domain:'IT ACCESS',key:false,freq:'Annual',sop:false,scope:'Type 1,2 · OS · DB',what:'Review of Rulesets for SoD and Sensitive Access Monitoring. Ensures ABI Global Ruleset and solution-level SoD rulesets are reviewed, updated and approved annually. Foundation control — IT_ACCESS_02 and 03 depend on this ruleset existing.',l1:'No additional requirement (not a key control).',l2:'ABI Global Ruleset reviewed and updated annually (approved by Global IC before Q1). Solution-level ruleset determined per Global Ruleset and reviewed before Q2 (approved by Zone IC). Covers: Critical, High, Medium, Low risk activities. Cannot be less stringent than Global Ruleset.',l3:'Workflow defined to evaluate customisations and include in ruleset on ongoing basis to ensure completeness and accuracy.',kpi:'Ruleset defined: Yes (compliant) / No (non-compliant) — binary KPI',notes:'NOT APPLICABLE if solution has no SoD or Sensitive Access. Global Ruleset approved before Q1; Solution ruleset before Q2.'},
{code:'IT_BC_01-K',name:'Backup',domain:'BACKUP & BC',key:true,freq:'Annual + Event-based',sop:false,scope:'Type 1,2,3 · OS · DB',what:'Backup. Ensures a documented backup strategy exists, is reviewed annually, and backups execute as scheduled. Failed backups must be documented and resolved in a timely manner. In line with ABI Backup Policy.',l1:'Define backup strategy including frequency and schedule for IT solution in line with Backup Policy. Review annually by control owner. Execute backups per defined schedule. Document and resolve any failed backups.',l2:'.',l3:'.',kpi:'No numeric KPI defined. Evidence: backup strategy document, annual revalidation evidence, execution evidence, action taken for failed backups.',notes:'Adherence to ABI Backup Policy mandatory. All Annual controls must execute before Q3. Applies to application layer, database layer and OS layer.'},
{code:'IT_BC_02',name:'Restore Testing',domain:'BACKUP & BC',key:false,freq:'Annual (as per BIA)',sop:false,scope:'Type 1,2,3',what:'Restore Testing. Validates that backups are actually recoverable and that RPO (Recovery Point Objective) and RTO (Recovery Time Objective) targets defined in the BIA are achievable. Required for Critical Financial/SOX/BIA High systems.',l1:'No additional requirement (not a key control).',l2:'Perform/revalidate BIA for the solution to determine RPO & RTO requirements and frequency of restoration testing. Execute restoration testing. Document and investigate any failures. Resolution in timely manner.',l3:'.',kpi:'BIA available in App360: Yes (compliant) / No (non-compliant) — binary KPI',notes:'Restoration testing mandatory for Critical Financial, SOX and BIA High systems. Strategy defined based on BIA document. All Annual controls must execute before Q3.'},
{code:'IT_BC_03',name:'Disaster Recovery and Business Continuity',domain:'BACKUP & BC',key:false,freq:'Annual + Event-based',sop:false,scope:'Type 1,2,3',what:'Disaster Recovery and Business Continuity. Ensures BIA is performed, DR Plan and IT Continuity Cookbook are created for High-risk solutions, and DR plans are tested annually. SaaS: validate in vendor SOC reports.',l1:'No additional requirement (not a key control).',l2:'Perform BIA to identify High-risk solutions (MBCO, RTO, RPO). For High-risk solutions: create IT Continuity Plan, DR Plan and Cookbook. Review and test IT Continuity Plan, DR Plan and Cookbook annually. For SaaS: review & validate business continuity in SOC reports received from vendor.',l3:'.',kpi:'No numeric KPI defined. Evidence: IT Continuity Plan, DR Plan & Cookbook; BIA document; DR test evidence recorded per BCP Policy.',notes:'Every DR test must be recorded and evidence retained per BCP Policy. All Annual controls must execute before Q3. SaaS applications: business continuity controls reviewed in vendor SOC reports.'},
{code:'IT_IF_01-K',name:'Monitoring of Jobs and Interfaces',domain:'INTERFACE',key:true,freq:'Event-based (continuous)',sop:false,scope:'Type 1,2,7 · OS · DB',what:'Monitoring of Jobs and Interfaces. Critical batch jobs and data interfaces must be continuously monitored. Failures remediated in a timely manner. Repeated failures require Root Cause Analysis. SOX systems: zero unmonitored critical jobs/interfaces.',l1:'Maintain list of batch jobs and interfaces categorised by criticality. Monitor critical jobs/interfaces continuously (alert-based or manual report review). Failures remediated via incident management. RCA for repeated failures. Critical batch jobs run via system user ID only.',l2:'All interfaces ensure automated completeness between source and target. All interfaces encrypted (data in transit). After restart, interfaces auto-restore consistency between source and target.',l3:'.',kpi:'Critical jobs/interfaces without monitoring: SOX =0% / Non-SOX ≤5% | L3 =0%\nCritical jobs/interfaces with unremediated failures: SOX =0% / Non-SOX ≤5% | L3 =0%',notes:'Monitoring can be alert-based or manual system reports. If jobs/interfaces not classified by criticality: apply control to ALL. Interfaces must use encrypted protocols (no FTP, Telnet). Completeness between source and target must be restorable after restart.'},
{code:'IT_NW_01',name:'Network Segmentation',domain:'NETWORK',key:false,freq:'Annual',sop:false,scope:'Type 1,2',what:'Network Segmentation. Strict network segmentation required for: e-commerce systems, brewery/supply vs. corporate/office networks, guest vs. internal networks, treasury/payment systems, and solutions with known critical vulnerabilities that cannot be remediated.',l1:'No additional requirement (not a key control).',l2:'Implement and maintain strict network segmentation for all defined critical systems. Document in network diagram clearly showing segmentation for each category.',l3:'.',kpi:'No numeric KPI defined. Evidence: network diagram clearly showing segmentation for critical systems categories.',notes:'Solutions with known critical vulnerabilities where remediation is infeasible must be network-isolated. Applies to brewery supply vs. corporate network — critical for OT/IT boundary. All Annual controls must execute before Q3.'},
{code:'IT_CHNG_01-K',name:'Change Management',domain:'CHANGE',key:true,freq:'Event-based + Monthly',sop:false,scope:'Type 1,2,3,4,5,7 · OS · DB',what:'Change Management. All changes to IT solutions implemented per ABI change management policy. Formal documentation and approvals required. No direct production changes — changes made in dev and moved to prod after testing. Monthly log review.',l1:'All changes implemented per ABI change management policy. Normal changes: all documentation/approvals before moving to production. Emergency changes: documentation/approvals within 1 week of production move. No direct production changes. Developers must not have write access to production. Monthly review of change logs by control owner.',l2:'Monthly change log review for adherence. Where production client opened: secure configuration restored after change.',l3:'Code logged in VCS linked to change requirements. Merged to master only after automated testing (Code Quality, Security, Unit, Component). Code movement to subsequent environments via automated tools only (Azure Pipelines, Jenkins, GitHub Actions). Access restrictions so developers cannot access conflicting production business functions.',kpi:'Changes moved to Prod without tickets: L2 =0% / L3 =0%',notes:'Developers should not have write access to production. If granted: all dev production activities must be reviewed for appropriateness. Emergency changes: maximum 1 week for documentation post-change.'},
{code:'IT_CHNG_02',name:'Code Review',domain:'CHANGE',key:false,freq:'Event-based',sop:false,scope:'Type 1,2,3 · DB',what:'Code Review. Secure code review performed and documented before deploying any code to production. Critical/High risk issues must be remediated before deployment. Uses approved code review tools.',l1:'No additional requirement (not a key control).',l2:'Secure code review performed and documented prior to production deployment. Code review via approved tool. Critical/High risk issues remediated before deployment. Approved tools: Synopsys, Checkmarx, VeraCode, Onapsis, LayerSeven, Snyk. If coding language not supported: follow NIST/OWASP guidelines via independent developer manual review.',l3:'.',kpi:'Critical/High unremediated issues: L2 =0 / L3 =0',notes:'Applicable only where ABI (or engaged 3rd party developers) has option to perform code development. If vendor-managed SaaS with no code access: may be marked Not Applicable.'},
{code:'IT_CHNG_03',name:'Incident & Problem Management',domain:'CHANGE',key:false,freq:'Event-based',sop:false,scope:'Type 1,2,4 · OS · DB',what:'Incident & Problem Management. Structured tracking of IT incidents (individual events) and Problems (root cause of recurring incidents). Ticketing tool with full audit trail mandatory. Problem Management requires trend analysis and action plans.',l1:'No additional requirement (not a key control).',l2:'All IT incidents logged, tracked and resolved in ticketing tool with audit trail. Tool captures: all associated configuration items, outstanding incidents, known and suspected errors. Problem Management: recurring incidents tracked, trends identified, action plans created to prevent or minimise future occurrences.',l3:'.',kpi:'No numeric KPI threshold. Evidence: ticketing tool export with open/in-progress/closed incidents and timestamps; problem tracking with action plans and owners.',notes:'Key distinction: Incident = individual event; Problem = root cause of recurring incidents. Evidence for audit: timestamp trail in ticketing tool. Problem Management evidence: trend analysis documents with corrective action plans.'},
{code:'IT_CHNG_04',name:'Project Management – Controls Assessment',domain:'CHANGE',key:false,freq:'Event-based',sop:false,scope:'Zone Level Control',what:'Project Management – Controls Assessment. New IT solutions assessed for MICS compliance before go-live. Only compliant projects go live. Business MICS controls impacted by new/changed solution must be identified and adjusted.',l1:'No additional requirement (not a key control).',l2:'Assess new projects for IT MICS compliance before go-live (per IT_INV_01). Only projects that pass all required MICS controls go live. Assess which business MICS controls are impacted by solution changes. Zone IC approval required for control design adjustments.',l3:'Workflow tool captures MICS compliance assessment at each project stage with approvals by Zone IC.',kpi:'Solutions in production without MICS assessment: L2 =0%',notes:'Projects cannot go-live if required MICS controls not implemented. Zone Solutions team tracks MICS status during implementation. First MICS assessment happens in quarter of identification.'},
{code:'IT_CHNG_05-K',name:'Project Management – Project Methodology',domain:'CHANGE',key:true,freq:'Event-based',sop:false,scope:'Zone Level Control',what:'Project Management – Project Methodology. Standard project management methodology (Waterfall, Agile/DevOps) followed for projects with CapEx >$200K. Data migration checks required. Formal handover to operations.',l1:'Follow standard project management methodology (Waterfall or Agile). For Waterfall: definition, scope, business & technical requirements documented, project plan, UAT performed, formal P2BAU handover. For Agile: VCS in place, code linked to change requirements, Pull Request approvals, automated test cases, pipeline configuration. If data migration involved: completeness and accuracy checks documented.',l2:'.',l3:'No additional requirement.',kpi:'No numeric KPI defined. Evidence: project list, methodology evidence, data migration checks and business owner approvals.',notes:'Scope limited to projects with CapEx spend >$200K. For DevOps projects: refer to IT_CHNG_01-K DevOps guidelines. P2BAU = Point to Business As Usual (moment system used for first time in production to support a business process).'},
{code:'IT_CHNG_06-K',name:'Direct Changes to SAP Production (SOX Systems Only)',domain:'CHANGE',key:true,freq:'Annual + Weekly + Event-based',sop:false,scope:'Type 1 (SOX systems only)',what:'Direct Changes to SAP Production (SOX Systems Only). SAP system configured to prevent direct production changes. Production client locked (T000 settings). Access via FFID only for exceptions. Weekly review of generic SAP accounts. Log review within 10 working days.',l1:'SAP system configured to prevent direct production changes (T000 parameters: Changes & Transport=2, No Cross-Client Maintenance=3, Copy Protection=L). Access for direct changes: restricted, exceptional cases only via FFID. Weekly review of generic SAP accounts (SAP*, DDIC, TMSADM, SAPOSS, EARLYWATCH): confirm available, default passwords changed, in SUPER group, locked when not in event. Logs reviewed within 10 working days of usage.',l2:'. L3 (Same as L2).',l3:'',kpi:'Client opening without approval: L2 =0% / L3 =0%\nUsage logs not reviewed within 10 working days: L2 ≤1% / L3 =0%',notes:'EFFECTIVE 1ST JUL 2025. Usage logs maintained outside SAP (SIEM) for minimum 18 months. T000 annual review must confirm parameters. Scope: SOX systems only. Discrepancies reported to ABI Ethics/Global Security & Compliance.'},
{code:'IT_SEC_01-K',name:'Password Settings',domain:'SECURITY',key:true,freq:'Annual + Event-based',sop:false,scope:'Type 1,2,3,4,5 · OS · DB',what:'Password Settings. Password settings for all user types (end-users, admin, system accounts) configured per ABI Security Policy (ABI_IS_POLICY_STD_2). Default passwords changed. SSO preferred. No exceptions unless technically infeasible.',l1:'Password settings configured per ABI security policy for all account types (end-users, admins, system accounts) to extent technically feasible. Exceptions approved by Zone S&C Director.',l2:'Default passwords for sensitive accounts changed immediately. No exceptions allowed. Where technical feasibility issue: SSO implemented to cover the risk.',l3:'IT Solution uses SSO login. Active Directory password settings configured per ABI security policy.',kpi:'No numeric KPI. Evidence: password settings screenshots, justification for any technical limitation, list of sensitive accounts with changed defaults.',notes:'Refer ABI_IS_POLICY_STD_2 for Password guidelines. All Annual controls must execute before Q3. SSO is the preferred authentication mechanism. No exceptions without Zone S&C Director approval.'},
{code:'IT_SEC_02',name:'Authentication Mechanisms for Administrative and/or Remote Access',domain:'SECURITY',key:false,freq:'Annual',sop:false,scope:'Type 1,2,3 | Zone Level (MFA for all users)',what:'Authentication Mechanisms for Administrative and/or Remote Access. MFA (Multi-Factor Authentication) mandatory for remote access into corporate network (Zone level) and for solutions with Critical IT/Business risks and vault platforms (Solution level). Max 0.5% non-enrolled users.',l1:'No additional requirement (not a key control).',l2:'-B (Annual – Solution Level): MFA configured for access to all IT solutions with Critical IT/Business risks and vault platforms containing privileged accounts. If technically infeasible: approval from Global Director AppSec required and documented.',l3:'.',kpi:'Users not enforced on MFA (Zone): ≤0.5% [rolling 30-day average, excluding users created in last 7 days]\nIT solutions on-boarded on MFA: Yes/No — binary KPI',notes:'Approved vault platforms: SAP GRC EAM, BeyondTrust, PIM. IT_SEC_02 assessed at BOTH Zone level (MFA for all users) and Solution level (MFA for vault and critical risk solutions). All Annual controls must execute before Q3.'},
{code:'IT_SEC_03',name:'Anti-Virus & Malware',domain:'SECURITY',key:false,freq:'Monthly + Weekly (L3)',sop:false,scope:'Zone Level Control',what:'Anti-Virus & Malware. All IT devices (Laptops, Desktops, Servers, Thin Clients, IaaS devices within ABI network perimeter including Azure, AWS, GCP) must have active, up-to-date anti-virus and anti-malware software installed.',l1:'No additional requirement (not a key control).',l2:'Control owner reviews central report of anti-virus/anti-malware status on all devices. Security incident raised for any device without updated AV or agent not communicating to central console. Incidents resolved by subsequent month or control is ineffective.',l3:'Centralised solution monitors AV/anti-malware deployment status and sends automated alerts to Security Operations team for issues.',kpi:'Devices without updated AV/anti-malware >1 month: Servers L2 =0% / L3 =0% | Workstations L2 ≤5% / L3 =0%',notes:'Deviations: AV not installed OR agent not communicating to central console. If same deviation identified in subsequent month = control is ineffective. Devices include all IaaS in ABI Azure/AWS/GCP subscriptions.'},
{code:'IT_SEC_05',name:'Hardening',domain:'SECURITY',key:false,freq:'Annual + Event-based',sop:false,scope:'Type 1,2,3,4 · OS · DB',what:'Hardening. IT solutions hardened per ABI recommended standards (CIS benchmark, DISA STIG, NIST, SAP security framework) or vendor guidelines. Covers OS, Application, Network, Database, Endpoint, Cloud, Web Server, IAM, Logging & Monitoring.',l1:'No additional requirement (not a key control).',l2:'IT solution hardened per ABI/vendor standards. Hardening document maintained and reviewed annually. IT solutions scanned periodically for secure configuration. Highest criticality gaps remediated. All interfaces use encryption and mutual authentication. No unsecure protocols (FTP, Telnet, HTTP for credentials). Firewall hardening: only necessary ports, each rule approved, default-deny rule implemented.',l3:'Secure configuration maintained via configuration management tool (e.g. Puppet).',kpi:'Hardening non-compliance as per ABI guidelines: L2 ≤5% / L3 ≤1%\n(Measured as: repeated vulnerabilities / total vulnerabilities AND high/critical vulnerabilities not remediated per SOC guidelines)',notes:'Hardening policy must be aligned with Global Security Architecture team. Exceptions approved by Global VP Solutions Security & Tech Ops. All Annual controls must execute before Q3. APIs: use standard authentication (JWT, OAuth), API gateway, max retry/jail, encryption, HTTPS.'},
{code:'IT_SEC_06',name:'Physical Security',domain:'SECURITY',key:false,freq:'Annual',sop:false,scope:'Type 1,2,3',what:'Physical Security. Periodic inspection of physical access and environmental security controls for all in-scope datacenter facilities. For 3rd party datacenters: annual review of independent assurance report (SOC I/II).',l1:'No additional requirement (not a key control).',l2:'For ABI-operated datacenters: periodic inspection of physical access and environmental security controls. Action plan for any issues found. For 3rd party datacenters: review SOC I/II report, verify physical security and environmental controls. Action plan for issues.',l3:'.',kpi:'No numeric KPI. Evidence: physical/environmental security controls inspection evidence; SOC I/II report (valid for audit period); action plans for issues.',notes:'All Annual controls must execute before Q3. For cloud/SaaS: physical security validated through vendor SOC reports.'},
{code:'IT_SEC_07',name:'Data Retention Management',domain:'SECURITY',key:false,freq:'Annual + Event-based',sop:false,scope:'Type 1,2,3',what:'Data Retention Management. For IT solutions containing personal data: data retention requirements defined and aligned with zone ethics/compliance team per local regulatory requirements. Archiving/deletion executed per defined frequency.',l1:'No additional requirement (not a key control).',l2:'For each IT solution containing personal data: define retention requirements and align with zone ethics and compliance team (local regulatory requirements vary by country). Execute archiving and/or data deletion per defined frequency annually.',l3:'.',kpi:'PIA available with Retention Period defined (if applicable): Yes (compliant) / No (non-compliant) — binary KPI',notes:'Data retention requirements vary by country for personal and sensitive personal data. Refer to GLOBAL DATA RETENTION & LEGAL HOLD POLICY. Applies to all DP-relevant solutions.'},
{code:'IT_SEC_08',name:'Vulnerability Scanning & Patch Management',domain:'SECURITY',key:false,freq:'Monthly + Event-based',sop:false,scope:'Type 1,2,3,4 · OS · DB',what:'Vulnerability Scanning & Patch Management. Regular vulnerability scanning of IT solutions. Gaps tracked to resolution. Critical/High vulnerabilities remediated per SOC guidelines. Essential patches implemented within 30 days. End-of-Life systems treated as vulnerabilities.',l1:'No additional requirement (not a key control).',l2:'Vulnerability scanning per SOC guidelines. All gaps have documented plan & target remediation date. Highest criticality gaps remediated per SOC timelines. Essential patches (security, stability, legal/regulatory) implemented in a timely manner (recommended: 30 days for critical). Exceptions approved by Global Director AppSec. End-of-Life/no-support systems = vulnerability requiring action.',l3:'IT solution maintains version no older than n-2 (where n = most recent available version). Automated tool monitors version and pushes patch upgrades.',kpi:'Critical/High unremediated vulnerabilities (overdue): L2 =0 / L3 not defined\nCritical patches not implemented within 30 days: L2 =0 / L3 not defined',notes:'Essential patches = non-negotiable: security vulnerabilities, system stability, legal/regulatory requirements. Vendor-unsupported systems = vulnerability. New upgrades identified via monitoring process. Refer to SOC Guidelines on Vulnerability Scanning.'},
{code:'IT_SEC_09',name:'Penetration Testing',domain:'SECURITY',key:false,freq:'As per AppSec Policy',sop:false,scope:'Type 1,2,3,4',what:'Penetration Testing. Penetration testing performed per ABI Application Security Policy timeline. Critical/High gaps tracked to resolution and remediated. Control fails if highest criticality gaps not remediated per AppSec Policy.',l1:'No additional requirement (not a key control).',l2:'Penetration testing performed per schedule. All gaps have documented target remediation date. Critical/High gaps remediated before deadline per AppSec Policy. Track and resolve all identified vulnerabilities.',l3:'.',kpi:'Pentest issues not remediated on time (Critical/High): L2 =0 / L3 =0',notes:'Link to ABI Application Security Policy for frequency requirements. Gaps identified must have a target remediation date. Control fails if highest criticality gaps not remediated per AppSec Policy timelines.'},
{code:'IT_SEC_10',name:'Social Media Accounts Security',domain:'SECURITY',key:false,freq:'Half-yearly + Event-based',sop:false,scope:'Zone Level Control',what:'Social Media Accounts Security. Access to official ABI social media accounts reviewed half-yearly. MFA enabled where technically feasible. Credentials managed via credential management platforms. Login notifications enabled.',l1:'No additional requirement (not a key control).',l2:'Maintain list of all official social media accounts. Control owner reviews access half-yearly and revokes unauthorised access. Access to social media platforms enabled via credential management platforms. MFA configured where technically feasible (approved by Zone Solutions Director). Login/email notification enabled.',l3:'.',kpi:'No numeric KPI. Evidence: user access list, half-yearly review evidence, access removal evidence (if any), emergency user account owner list, MFA configuration evidence.',notes:'Social media apps must not have access to Strictly Confidential/Confidential/Internal Use Only data per policy. Emergency user account owners defined for each platform. Refer to ABI Asset Management Policy 3.2 for information classification.'},
{code:'IT_INV_01',name:'IT Solutions Inventory',domain:'INVENTORY',key:false,freq:'Event-based + Quarterly',sop:false,scope:'Zone Level Control',what:'IT Solutions Inventory. All live IT solutions classified as critical maintained in App360 with complete attributes. Quarterly review by Portfolio Managers and all Risk Owners. Foundation for all MICS controls — scope is determined here.',l1:'No additional requirement (not a key control).',l2:'Maintain inventory in App360 with: unique name, description, IT owner, business owner, solution type, all 6 risk classifications (SOX, BIA, DP, Crown Jewel, External Facing, ESG) with formal sign-offs. Include PowerApps where output is input to a SOX control. Include SOX-relevant BI solutions. Quarterly review by Portfolio Managers and all Risk Owners in App360. Solutions identified in quarterly review enter MICS scope no later than one quarter after identification (first assessment in quarter of identification).',l3:'.',kpi:'Key information missing in inventory master data: L2 ≤1% / L3 =0%\nSolutions without Risk Owner review: L2 ≤5% / L3 =0%',notes:'Disqualifier: IT solutions in production but NOT in inventory = immediate finding. Risk classification sign-offs: SOX by IC+External Auditors, BIA by Zone ManCom, DP by Zone Legal, Crown Jewel by Zone IC, External by IT Security Lead/SOC, ESG by Zone IC/ESG Controller.'},
{code:'IT_INV_02',name:'Mapping All IT Components of the Application',domain:'INVENTORY',key:false,freq:'Annual + Quarterly',sop:false,scope:'Type 1,2',what:'Mapping All IT Components of the Application. Technical map prepared and reviewed annually per environment (dev, test, prod). Covers: all hosts and functions, databases, interfaces & integrations, network architecture, end-user access points. Quarterly maintenance of component lists.',l1:'No additional requirement (not a key control).',l2:'Prepare technical map per environment containing: all hosts and functions (load balancers, app servers, DB servers), all databases + storage components, all interfaces & integrations (internal and external), network architecture (subnets, segments, firewall, VPN gateways), end-user access points. Quarterly maintenance of: shared folders/drives list, AD groups for front-end/back-end access, ACL lists, support partners RACI, Servers & Databases (incl. VMs, Resource Groups, Subscriptions), connected tools (Change Mgmt, scheduling, code repository), critical upstream/downstream dependencies.',l3:'.',kpi:'No numeric KPI. Evidence: technical map/diagram, periodic review evidence, changes documented with version control.',notes:'Applies to ALL IT solutions including SaaS, IaaS, PaaS. All Annual reviews by Application Owner must complete before Q3. This control feeds IT_ACCESS_12 (interface folder access).'},
{code:'IT_LICENSE_01',name:'Software Asset & License Management',domain:'LICENSE',key:false,freq:'Annual',sop:false,scope:'Zone Level Control',what:'Software Asset & License Management. Software Asset Management (SAM) tool with agents deployed across all hosts to track deployment vs. license entitlements for at least the top 8 publishers. Deviations resolved to minimise over/under exposure.',l1:'No additional requirement (not a key control).',l2:'SAM tool with agents deployed across all hosts recording deployment and license details (in use vs. procured). Analyse license posture per publisher (covering at least top 8). When deviations identified: take timely action to resolve and minimise over/under exposure.',l3:'.',kpi:'No numeric KPI. Evidence: SAM tool review evidence for vendor license management; action log for resolving deviations.',notes:'All Annual controls must execute before Q3. SAM tool must have agents on all hosts. Top 8 publishers minimum coverage.'},
{code:'IT_ISAE_01-K',name:'ISAE / Contract Review',domain:'ASSURANCE',key:true,freq:'Annual',sop:false,scope:'Type 1,2,3,4,5 · OS · DB',what:'ISAE / Contract Review. Annual review of 3rd party service provider ISAE 3402 (SOC) reports or contracts to ensure all IT MICS control risks are addressed by the vendor. For SOX systems: SOC 1 Type 2 reports mandatory.',l1:'Review ISAE 3402 report or contract from 3rd party service provider annually to ensure risks per ABI IT MICS guidelines are addressed. Action plans defined and tracked for any issues reported.',l2:'. L3 (Same as L2).',l3:'',kpi:'No numeric KPI. Evidence: ISAE 3402/SOC I/II report or contract (valid for audit period), annual review evidence, action plan tracking for issues.',notes:'Control marked \'Relying on Contract/ISAE 3402\' ONLY if relevant controls explicitly covered in contract/report. For SOX solutions: SOC 1 Type 2 mandatory. Issues → action plan tracked to closure. Refer to Third Party Compliance Guidelines.'},
{code:'IT_AUTO_01',name:'Inventory of Robots Used for Process Automation (RPA)',domain:'RPA',key:false,freq:'Event-based + Quarterly',sop:false,scope:'Zone Level Control',what:'Inventory of Robots Used for Process Automation (RPA). All production RPA bots inventoried in Zone BOT Inventory. New bots reviewed and approved by Zone Internal Controls before moving to production. Inventory reviewed quarterly for completeness.',l1:'No additional requirement (not a key control).',l2:'For any new BOT: update Zone BOT Inventory with all required details per Global RPA Policy (unique ID, technical platform, description of activities, applications touched, controls checklist, criticality for financial reporting, stage). BOT moved to production ONLY after Zone IC review and approval. Quarterly review of Zone BOT Inventory for completeness.',l3:'Workflow used in Zone BOT Inventory to track development stages with approvals captured at each stage by Zone IC.',kpi:'Critical information missing in BOT master data: L2 ≤5% / L3 ≤2%',notes:'A BOT is financial-critical if: execution impacts Balance Sheet/P&L, executes SoD/Sensitive Activities Ruleset activities, or influences a key MICS control. Refer to ABI_GIS_POLICY_ANX_10 (BOT Policy).'},
{code:'IT_AUTO_02',name:'Business Monitoring of Robots',domain:'RPA',key:false,freq:'Monthly + Event-based',sop:false,scope:'Zone Level Control',what:'Business Monitoring of Robots. Financial-critical BOTs reviewed periodically for abnormalities. Monitoring covers: BOT crashes, duplicate execution over same dataset, abnormal behaviour due to changed process or abnormal input, credential misuse.',l1:'No additional requirement (not a key control).',l2:'Critical BOTs reviewed periodically to ensure no discrepancies/abnormalities in functioning. Review performed independently (not through BOT\'s own report) via predefined script. Sanity check or reconciliation via independent control BOT.',l3:'Critical BOTs continuously monitored via automated solution (MRT, DB Logger, etc.) providing alerts to control owner for any discrepancies/abnormalities.',kpi:'No numeric KPI. Evidence: list of critical BOTs, BOT monitoring evidence, actions taken for issues/failures.',notes:'Review must be independent — do NOT use the report generated by the BOT under review. Sanity check examples: back-of-envelope calculation, BOT-generated data reconciliation via independent control BOT. All 5 BOT failure scenarios must be covered.'},
{code:'IT_AI_01',name:'AI Solutions Oversight & Compliance Control (NEW IN 2026)',domain:'AI',key:false,freq:'Event-based + Quarterly + Ongoing',sop:false,scope:'Type 1 (AI solutions)',what:'AI Solutions Oversight & Compliance Control (NEW IN 2026). All AI-related applications and tools recorded in App360 before deployment. Quarterly review by Portfolio Managers and Risk Owners. Controls implemented per AI Governance Policy. Covers standalone AI apps, AI utilities/scripts, 3rd party AI SaaS, custom AI, embedded AI modules.',l1:'No additional requirement (not a key control).',l2:'Record ALL AI applications/tools in App360 before deployment or use. Quarterly review by Performance Manager and Risk Owners. Implement controls per AI Governance Policy: (1) all AI accounts unique with human oversight; (2) AI activity monitoring jobs configured, output validation for financial AI, logs retained for audit; (3) robust output validation before production; (4) code review per secure AI coding standards, issues resolved before production; (5) change management process preventing single individual from deploying to production without secondary validation; (6) AI incidents managed per ABI Security Policy with AI-specific considerations — critical AI incidents require immediate escalation.',l3:'.',kpi:'No numeric KPI in current draft. Evidence: AI Inventory in App360, review evidence by Service Owner/Risk Owners/Portfolio Managers, control monitoring evidence per AI checkpoint guidelines.',notes:'⚠ NEW CONTROL IN IT MICS 2026. Scope: standalone AI apps, AI utilities/ML scripts, 3rd party AI SaaS tools, custom-developed AI, embedded AI modules that can be independently accessed or configured. Refer to ABI AI Playbook for development lifecycle best practices.'},

function GuideKeyBadge(){return <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold text-red-400 bg-red-500/10 border border-red-500/30"><KeyRound className="w-3 h-3"/>KEY</span>}
function GuideSopBadge(){return <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold text-yellow-400 bg-yellow-500/10 border border-yellow-500/30"><FileCheck2 className="w-3 h-3"/>SOP</span>}

        <h2 className="text-2xl sm:text-3xl font-black text-white">{ctrl.code}</h2>

        {[['L1',ctrl.l1],['L2',ctrl.l2],['L3',ctrl.l3]].map(([lvl,txt])=>(
          <div key={lvl} className="flex gap-3 mb-3">

            <p className="text-sm text-neutral-300 leading-relaxed pt-1.5">{txt}</p>

function GuideGridView({onOpen}){
  const[search,setSearch]=useState('');
  const[domain,setDomain]=useState('ALL');
  const filtered=useMemo(()=>{const q=search.trim().toLowerCase();return GUIDE_CONTROLS.filter(c=>(domain==='ALL'||c.domain===domain)&&(!q||c.code.toLowerCase().indexOf(q)!==-1||c.name.toLowerCase().indexOf(q)!==-1));},[search,domain]);
  const grouped=useMemo(()=>{const g={};filtered.forEach(c=>{(g[c.domain]=g[c.domain]||[]).push(c)});return GUIDE_DOMAINS.filter(d=>g[d]).map(d=>[d,g[d]]);},[filtered]);
  return (
    <div className="max-w-5xl mx-auto">
      <div className="flex flex-wrap items-end justify-between gap-4 mb-6">
        <div>
          <h1 className="text-2xl sm:text-3xl font-bold text-white">Control <span className="text-yellow-500">Detail Guide</span></h1>
          <p className="text-sm text-neutral-500 mt-1">{GUIDE_CONTROLS.length} MICS controls — click a card for full execution details</p>
        </div>
        <div className="relative">
          <Search className="w-4 h-4 text-neutral-500 absolute left-3 top-1/2 -translate-y-1/2"/>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search control..."
            className="bg-neutral-900 border border-neutral-800 rounded-lg pl-9 pr-8 py-2 text-sm text-white placeholder-neutral-600 focus:outline-none focus:border-yellow-500 w-64"/>
          {search&&<button onClick={()=>setSearch('')} className="absolute right-2 top-1/2 -translate-y-1/2 text-neutral-500 hover:text-white"><X className="w-4 h-4"/></button>}
        </div>
      </div>
      <div className="flex flex-wrap gap-2 mb-8">
        {['ALL'].concat(GUIDE_DOMAINS).map(d=>(
          <button key={d} onClick={()=>setDomain(d)}
            className={'text-xs font-bold px-3 py-1.5 rounded-full border transition-colors '+(domain===d?'bg-yellow-500 text-black border-yellow-500':'text-neutral-400 border-neutral-800 hover:border-neutral-600')}>
            {d}
          </button>
        ))}
      </div>
      {grouped.length===0&&<p className="text-neutral-500 text-sm">No controls match your search.</p>}
      {grouped.map(([dom,list])=>(
        <div key={dom} className="mb-8">
          <h2 className="text-[11px] font-bold tracking-widest text-neutral-500 uppercase mb-3">{dom}</h2>
          <div className="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 gap-3">
            {list.map(c=>(
              <button key={c.code} onClick={()=>onOpen(c)}
                className="text-left bg-neutral-900 border border-neutral-800 hover:border-yellow-500/60 rounded-xl p-4 transition-colors group">
                <div className="flex items-center justify-between mb-2">
                  <span className="font-black text-white text-sm group-hover:text-yellow-500 transition-colors">{c.code}</span>
                  {c.key&&<GuideKeyBadge/>}
                </div>
                <p className="text-sm text-neutral-400 mb-3 leading-snug">{c.name}</p>
                <div className="flex items-center gap-2"><GuideFreqBadge freq={c.freq}/>{c.sop&&<GuideSopBadge/>}</div>
              </button>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

function MicsSuite() {
  const ADMIN_USERNAME = 'admin';
  const ADMIN_PASSWORD = 'MICS360';
  const [isUnlocked, setIsUnlocked] = useState(false);
  const [loginUsername, setLoginUsername] = useState('');
  const [loginInput, setLoginInput] = useState('');
  const [loginError, setLoginError] = useState('');
  const [ready, setReady] = useState(false);
  const [currentUserName, setCurrentUserName] = useState('');

  const [activeModule, setActiveModule] = useState(null);

  const [periodsData, setPeriodsData] = useState({});
  const [selectedPeriod, setSelectedPeriod] = useState(null);
  const [monStatus, setMonStatus] = useState(null);
  const [monLoading, setMonLoading] = useState(false);
  const [columnAliases, setColumnAliases] = useState(DEFAULT_COLUMN_ALIASES);
  const [showSettings, setShowSettings] = useState(false);
  const [newColInput, setNewColInput] = useState({ aplicacao: '', status: '', mes: '', ano: '' });
  const [detailStatusKey, setDetailStatusKey] = useState(null);
  const monFileInputRef = useRef(null);

  const [guideSelectedCtrl, setGuideSelectedCtrl] = useState(null);

  const [farolRows, setFarolRows] = useState([]);
  const [fileInfo, setFileInfo] = useState(null);
  const [ctrlStatus, setCtrlStatus] = useState(null);
  const [ctrlLoading, setCtrlLoading] = useState(false);
  const [selectedApp, setSelectedApp] = useState(null);
  const [searchTerm, setSearchTerm] = useState('');
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState(null);
  const [appsList, setAppsList] = useState(DEFAULT_ALLOWED_APPS);
  const [farolLocked, setFarolLocked] = useState(false);
  const [addingApp, setAddingApp] = useState(false);
  const [newAppName, setNewAppName] = useState('');
  const [editingApp, setEditingApp] = useState(null);
  const [editAppName, setEditAppName] = useState('');
  const [editAppSM, setEditAppSM] = useState('');
  const ctrlFileInputRef = useRef(null);
  const backupFileInputRef = useRef(null);
  const [backupStatus, setBackupStatus] = useState(null);

  useEffect(() => {
    let mounted = true;
    (async () => {
      try {
        const result = await window.storageGet('mics2026-periods-shared');
        if (mounted && result && result.value) {
          const parsed = JSON.parse(result.value);
          let needsMigration = false;
          Object.keys(parsed).forEach(k => {
            if (typeof parsed[k].locked === 'undefined') { parsed[k].locked = true; needsMigration = true; }
          });
          setPeriodsData(parsed);
          const keys = Object.keys(parsed).sort();
          let initialPeriod = keys.length ? keys[keys.length - 1] : null;
          try {
            const lastActive = await window.storageGet('mics2026-last-active-period');
            if (lastActive && lastActive.value && parsed[lastActive.value]) initialPeriod = lastActive.value;
          } catch (e) {}
          if (initialPeriod) setSelectedPeriod(initialPeriod);
          if (needsMigration) { try { await window.storageSet('mics2026-periods-shared', JSON.stringify(parsed)); } catch (e) {} }
        }
      } catch (e) {}
      try {
        const r2 = await window.storageGet('mics2026-col-aliases-shared');
        if (mounted && r2 && r2.value) setColumnAliases(withColumnDefaults(JSON.parse(r2.value)));
      } catch (e) {}
      try {
        const r4 = await window.storageGet('mics2026-farol-data');
        if (mounted && r4 && r4.value) {
          const parsed = JSON.parse(r4.value);
          setFarolRows(parsed.rows || []);
          setFileInfo({ fileName: parsed.fileName, importedAt: parsed.importedAt });
          if (typeof parsed.locked === 'undefined') {
            const shouldLock = (parsed.rows || []).length > 0;
            setFarolLocked(shouldLock);
            if (shouldLock) {
              try { await window.storageSet('mics2026-farol-data', JSON.stringify(Object.assign({}, parsed, { locked: true }))); } catch (e) {}
            }
          } else {
            setFarolLocked(!!parsed.locked);
          }
        }
      } catch (e) {}
      try {
        const r5 = await window.storageGet('mics2026-farol-apps-list');
        if (mounted && r5 && r5.value) setAppsList(JSON.parse(r5.value));
      } catch (e) {}
      if (mounted) setReady(true);
    })();
    return () => { mounted = false; };
  }, []);

  const persistPeriods = async (data) => { try { await window.storageSet('mics2026-periods-shared', JSON.stringify(data)); } catch (e) { console.error(e); } };
  const persistColAliases = async (data) => { try { await window.storageSet('mics2026-col-aliases-shared', JSON.stringify(data)); } catch (e) { console.error(e); } };
  const persistFarol = async (rows, info, locked) => { try { await window.storageSet('mics2026-farol-data', JSON.stringify({ rows, fileName: info.fileName, importedAt: info.importedAt, locked: !!locked })); } catch (e) { console.error(e); } };
  const persistAppsList = async (list) => { try { await window.storageSet('mics2026-farol-apps-list', JSON.stringify(list)); } catch (e) { console.error(e); } };
  const persistLastActivePeriod = async (key) => { try { await window.storageSet('mics2026-last-active-period', key || ''); } catch (e) { console.error(e); } };
  const selectPeriod = (key) => { setSelectedPeriod(key); persistLastActivePeriod(key); };

  const handleLogin = () => {
    setLoginError('');
    if (loginUsername.trim().toLowerCase() === ADMIN_USERNAME && loginInput === ADMIN_PASSWORD) {
      setIsUnlocked(true); setLoginInput(''); setCurrentUserName('Admin');
    } else {
      setLoginError('Incorrect username or password.');
    }
  };
  const handleLogout = () => { setIsUnlocked(false); setActiveModule(null); setCurrentUserName(''); setGuideSelectedCtrl(null); };

  const addColAlias = async (field) => {
    const val = newColInput[field].trim().toLowerCase();
    if (!val) return;
    const cur = columnAliases[field] || [];
    if (cur.indexOf(val) !== -1) { setNewColInput(prev => Object.assign({}, prev, { [field]: '' })); return; }
    const updated = Object.assign({}, columnAliases, { [field]: cur.concat([val]) });
    setColumnAliases(updated); await persistColAliases(updated);
    setNewColInput(prev => Object.assign({}, prev, { [field]: '' }));
  };
  const removeColAlias = async (field, alias) => {
    const updated = Object.assign({}, columnAliases, { [field]: (columnAliases[field] || []).filter(a => a !== alias) });
    setColumnAliases(updated); await persistColAliases(updated);
  };
  const detectColKey = (row, field, aliases) => {
    const list = (aliases[field] || []).map(a => a.toLowerCase().trim());
    return Object.keys(row).find(k => list.indexOf(k.toLowerCase().trim()) !== -1);
  };
  const parseOneMonFile = async (file, aliases) => {
    const buffer = await file.arrayBuffer();
    const wb = XLSX.read(buffer, { type: 'array', cellDates: true });
    let sheetName = wb.SheetNames[0];
    for (let i = 0; i < wb.SheetNames.length; i++) {
      if (/task|dashboard|scorecard|controle|monitoring|pending/i.test(wb.SheetNames[i])) { sheetName = wb.SheetNames[i]; break; }
    }
    const sheet = wb.Sheets[sheetName];
    const rawRows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
    if (!rawRows.length) return { error: 'The "' + file.name + '" sheet appears to be empty.' };
    const rows = rawRows.map(r => { const c = {}; Object.keys(r).forEach(k => { c[String(k).trim()] = r[k]; }); return c; });
    const appKey = detectColKey(rows[0], 'aplicacao', aliases);
    const statusKey = detectColKey(rows[0], 'status', aliases);
    const mesKey = detectColKey(rows[0], 'mes', aliases);
    const anoKey = detectColKey(rows[0], 'ano', aliases);
    if (!statusKey) return { error: "Couldn't find the Status column in \"" + file.name + '". Columns: ' + Object.keys(rows[0]).join(', ') };
    const taskRows = rows.map(r => {
      let rowPeriodKey = null;
      if (mesKey && anoKey) {
        const mVal = parseMonthValue(r[mesKey]); const yVal = parseYearValue(r[anoKey]);
        if (mVal && yVal) rowPeriodKey = yVal + '-' + String(mVal).padStart(2, '0');
      }
      return { aplicacao: appKey && r[appKey] ? String(r[appKey]).trim() : 'General', statusRaw: r[statusKey], periodKey: rowPeriodKey, raw: r };
    });
    return { taskRows, count: taskRows.length };
  };
  const handleMonFiles = async (fileList) => {
    if (!isUnlocked) return;
    setMonLoading(true); setMonStatus(null);
    try {
      const aliases = withColumnDefaults(columnAliases);
      const files = Array.from(fileList);
      const errors = []; const importedByPeriod = {};
      const now = new Date();
      const fallbackPeriodKey = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
      for (const file of files) {
        try {
          const result = await parseOneMonFile(file, aliases);
          if (result.error) { errors.push(result.error); }
          else {
            const filePeriodKey = extractPeriodFromFilename(file.name) || fallbackPeriodKey;
            result.taskRows.forEach(row => {
              const pKey = row.periodKey || filePeriodKey;
              if (!importedByPeriod[pKey]) importedByPeriod[pKey] = { taskRows: [], names: {} };
              importedByPeriod[pKey].taskRows.push(row);
              importedByPeriod[pKey].names[file.name] = (importedByPeriod[pKey].names[file.name] || 0) + 1;
            });

                      className="w-full bg-black border border-neutral-700 rounded px-2 py-1.5 text-xs text-white mb-2 focus:outline-none focus:border-yellow-500" />
                    <div className="flex items-center gap-2">
                      <button onClick={addNewApp} className="text-emerald-400 hover:text-emerald-300 p-1" title="Add"><Save className="w-4 h-4" /></button>
                      <button onClick={() => { setAddingApp(false); setNewAppName(''); }} className="text-neutral-500 hover:text-red-400 p-1" title="Cancel"><Ban className="w-4 h-4" /></button>
                    </div>
                  </div>
                ) : (
                  <button onClick={() => setAddingApp(true)} className="flex flex-col items-center justify-center gap-1 rounded-lg p-3 border border-dashed border-neutral-700 hover:border-yellow-500/60 text-neutral-500 hover:text-yellow-500 transition-colors min-h-[6rem]">
                    <Plus className="w-6 h-6" />
                    <span className="text-xs">New application</span>
                  </button>
                ))}
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<MicsSuite />);
</script>
</body>
</html>
